[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gentstore"
version = "1.3.0"
description = "Graphical front-end for Portage on Gentoo Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Janek" }]
keywords = ["gentoo", "portage", "emerge", "package-manager", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]

# `portage` is provided by sys-apps/portage and is not installable from PyPI,
# so it is deliberately absent here — see Docs/01-architecture.md §8.
dependencies = ["PyQt6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
gentstore = "gentstore.app:main"

[project.urls]
Repository = "https://github.com/JamJan05/GentStore"

[tool.setuptools.packages.find]
include = ["gentstore*"]

[tool.setuptools.package-data]
gentstore = ["ui/theme/icons/*.svg", "i18n/*.ts", "i18n/*.qm"]

[tool.pytest.ini_options]
# Run the tests against the working tree, without installing the package first.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
