# The fast half of the answer to "does this still work?".
#
# Until now nothing ran the suite except the maintainer's machine and the ebuild
# on a user's, and 1.1.1 is what that cost: a release whose own tests failed, so
# `emerge` with USE=test died in src_test for everybody who tried it. Nothing in
# between had looked.
#
# This runs on a host with no Gentoo on it, which is most of the suite and all of
# the linting, in about two minutes. `pip install portage` is what makes that
# possible: Portage publishes to PyPI, so the pure functions that need
# `portage.versions` work here, while everything that needs a real tree skips
# through the portage_env fixture in tests/conftest.py.
#
# What it therefore does not cover: every test that reads /var/db/pkg or
# /var/db/repos. tests-gentoo.yml runs those, in a container that has them.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # tests/test_release.py resolves every ref CHANGELOG.md links to, and
          # a shallow clone has none of them: the first run failed on 6dd751f,
          # the commit 1.1.1 was withdrawn from.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: The libraries a PyQt6 wheel loads even off-screen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libdbus-1-3 libglib2.0-0t64 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
          # lrelease, to build the .qm catalogues from the .ts files. They are
          # generated and not committed, so without this the interface has no
          # Polish and the two tests that switch language fail.
          sudo apt-get install --no-install-recommends -y qt6-l10n-tools \
            || sudo apt-get install --no-install-recommends -y qttools5-dev-tools
          echo /usr/lib/qt6/bin >> "${GITHUB_PATH}"

      - name: Install
        run: python -m pip install --upgrade pip pytest ruff PyQt6 portage

      - name: Compile the translation catalogues
        run: python tools/i18n.py compile

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs
